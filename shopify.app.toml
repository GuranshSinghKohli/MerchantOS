# Official Shopify app config.
# https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration
# Staging hostname is merchantos.duckdns.org. Never put the client secret here.

name = "MerchantOS"
client_id = "7ccdb79e26e19275533051e78f66a876"
application_url = "https://merchantos.duckdns.org"
embedded = false

[access_scopes]
# Re-validated against https://shopify.dev/docs/api/usage/access-scopes (2026-08-26).
# write_products is limited to allowlisted product metadata mutations (Phase 9).
scopes = "read_products,write_products,read_orders,read_customers,read_inventory,read_locations,read_discounts"
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://merchantos.duckdns.org/api/v1/auth/shopify/callback",
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/api/v1/webhooks/shopify/app/uninstalled"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/v1/webhooks/shopify/compliance"

[[webhooks.subscriptions]]
topics = [
  "products/create",
  "products/update",
  "products/delete",
  "orders/create",
  "orders/updated",
  "orders/cancelled",
  "customers/create",
  "customers/update",
  "customers/delete",
  "inventory_levels/update",
  "locations/create",
  "locations/update",
]
uri = "/api/v1/webhooks/shopify/commerce"
