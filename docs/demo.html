<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MerchantOS demo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #09090b;
        color: #fafafa;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 20px;
        color: #a1a1aa;
        line-height: 1.5;
      }
      video {
        display: block;
        width: 100%;
        background: #000;
        border-radius: 12px;
      }
      a {
        color: #2dd4bf;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MerchantOS</h1>
      <p>
        90-second demo. The model recommends. The merchant approves. Deterministic
        code executes.
      </p>
      <video controls playsinline preload="metadata" src="MerchantOS-demo.mp4">
        Your browser cannot play this video.
        <a href="MerchantOS-demo.mp4">Download it instead</a>.
      </video>
      <p style="margin-top: 20px">
        <a href="https://github.com/GuranshSinghKohli/MerchantOS">GitHub</a>
      </p>
    </main>
  </body>
</html>
