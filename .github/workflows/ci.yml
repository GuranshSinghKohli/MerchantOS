name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: merchantos
          POSTGRES_PASSWORD: merchantos
          POSTGRES_DB: merchantos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merchantos -d merchantos"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.11
        ports:
          - 9324:9324
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql://merchantos:merchantos@localhost:5432/merchantos
      REDIS_URL: redis://localhost:6379/0
      SQS_ENDPOINT_URL: http://localhost:9324
      SQS_QUEUE_NAME: merchantos-dev-jobs
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      SHOPIFY_API_KEY: test_key
      SHOPIFY_API_SECRET: test_secret
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-packages --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Lint
        run: pnpm web:lint
      - name: Typecheck
        run: pnpm web:typecheck
      - name: Test
        run: pnpm web:test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate
        run: |
          terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infra/terraform/bootstrap validate
          for env in staging production; do
            terraform -chdir="infra/terraform/envs/$env" init -backend=false -input=false
            terraform -chdir="infra/terraform/envs/$env" validate
          done
