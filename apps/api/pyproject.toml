[project]
name = "merchantos-api"
version = "0.1.0"
description = "MerchantOS FastAPI HTTP service"
requires-python = ">=3.12"
dependencies = [
    "merchantos-domain",
    "merchantos-observability",
    "merchantos-db",
    "merchantos-queue",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merchantos_api"]

[tool.uv.sources]
merchantos-domain = { workspace = true }
merchantos-observability = { workspace = true }
merchantos-db = { workspace = true }
merchantos-queue = { workspace = true }
