[project]
name = "merchantos-llm"
version = "0.1.0"
description = "LLMPort, FakeLLM, and OpenAI adapter"
requires-python = ">=3.12"
dependencies = [
    "merchantos-domain",
    "pydantic>=2.10",
    "openai>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merchantos_llm"]

[tool.uv.sources]
merchantos-domain = { workspace = true }
