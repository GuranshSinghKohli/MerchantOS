[project]
name = "merchantos-queue"
version = "0.1.0"
description = "Queue port plus development ElasticMQ adapter"
requires-python = ">=3.12"
dependencies = [
    "merchantos-domain",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merchantos_queue"]

[tool.uv.sources]
merchantos-domain = { workspace = true }
