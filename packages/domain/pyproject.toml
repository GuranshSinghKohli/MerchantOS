[project]
name = "merchantos-domain"
version = "0.1.0"
description = "MerchantOS domain types with no framework imports"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merchantos_domain"]
