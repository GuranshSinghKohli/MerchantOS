[project]
name = "merchantos-shopify"
version = "0.1.0"
description = "Shopify OAuth, HMAC, GraphQL Admin client, and token encryption"
requires-python = ">=3.12"
dependencies = [
    "merchantos-domain",
    "cryptography>=44.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merchantos_shopify"]

[tool.uv.sources]
merchantos-domain = { workspace = true }
