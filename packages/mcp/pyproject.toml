[project]
name = "merchantos-mcp"
version = "0.1.0"
description = "In-process MCP-compatible read tool registry"
requires-python = ">=3.12"
dependencies = [
    "merchantos-domain",
    "merchantos-observability",
    "merchantos-app",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merchantos_mcp"]

[tool.uv.sources]
merchantos-domain = { workspace = true }
merchantos-observability = { workspace = true }
merchantos-app = { workspace = true }
